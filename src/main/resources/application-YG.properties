# -----------------------------------
# General Spring Boot Configuration
# -----------------------------------
spring.application.name=api-bonap
server.port=8080

#----------------------------------------------------
# Database connection configuration (MySQL local)
#----------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/bonapp_local
spring.datasource.username=root
spring.datasource.password=root_password
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway activé pour la base locale
spring.flyway.enabled=true

#----------------------------------------------------
# Hibernate / JPA configuration
#----------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#----------------------------------------------------
# Logging Configuration
#----------------------------------------------------
logging.level.org.springframework=INFO

# Activer les logs détaillés pour JPA
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
